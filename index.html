<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#233246">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <title>Planner</title>
  <link rel="icon" href="icons/omi-logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      var prof = (new URLSearchParams(location.search).get('profile') || '').toLowerCase();
      var k = function (n) { return /^[a-z0-9-]{1,24}$/.test(prof) ? n + ':' + prof : n; };
      var font = localStorage.getItem(k('planner-font'));
      if (font) document.documentElement.setAttribute('data-font', font);
      var styleCss = localStorage.getItem(k('planner-style-css'));
      if (styleCss) { var st = document.createElement('style'); st.id = 'style-tokens'; st.textContent = styleCss; document.head.appendChild(st); }
      var theme = localStorage.getItem(k('planner-theme'));
      if (theme && theme !== 'system') document.documentElement.setAttribute('data-theme', theme);
      var sizes = JSON.parse(localStorage.getItem(k('planner-sizes')) || 'null');
      if (sizes) {
        document.documentElement.style.setProperty('--scale', sizes.text);
        document.documentElement.style.setProperty('--bucket-fs', sizes.bucket + 'px');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Navigation"></aside>
    <div id="shell">
      <header id="topbar"></header>
      <main id="main"></main>
      <nav id="tabbar" aria-label="Sections"></nav>
    </div>
  </div>
  <dialog id="taskDialog" aria-label="Task details"></dialog>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Planner needs JavaScript to run.</noscript>
  <script src="js/core.js"></script>
  <script src="js/views.js"></script>
  <script src="js/task.js"></script>
  <script src="js/team.js"></script>
  <script src="js/timebox.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/import.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/styles.js"></script>
  <script src="js/devicefolder.js"></script>
  <script src="js/dropbox.js"></script>
  <script src="js/usage.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/brandplan.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
  <script src="js/fitness.js"></script>
  <script src="js/growth.js"></script>
  <script src="js/alarm.js"></script>
  <script src="js/history.js"></script>
  <script src="js/resize.js"></script>
</body>
</html>
